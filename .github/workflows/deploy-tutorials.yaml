# Deploys inst/tutorials/* to shinyapps.io whenever tutorial content changes.
# Requires repo secrets SHINYAPPS_ACCOUNT, SHINYAPPS_TOKEN, SHINYAPPS_SECRET
# for a single consolidated shinyapps.io account (see rsconnect metadata under
# inst/tutorials/*/rsconnect/documents/ for the existing per-tutorial app links).
on:
  push:
    branches: [main, master]
    paths:
      - 'inst/tutorials/**'
  workflow_dispatch:

name: deploy-tutorials

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-tutorials-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rsconnect, local::.
          needs: check

      - name: Deploy tutorials to shinyapps.io
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          rsconnect::setAccountInfo(
            name = Sys.getenv("SHINYAPPS_ACCOUNT"),
            token = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )
          tutorials <- list.dirs("inst/tutorials", recursive = FALSE)
          for (dir in tutorials) {
            message("Deploying ", dir)
            rsconnect::deployApp(appDir = dir, forceUpdate = TRUE, launch.browser = FALSE)
          }
        shell: Rscript {0}
